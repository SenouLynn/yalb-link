syntax = "proto3";

package gcs.v1;

import "gcs/v1/types.proto";

option go_package = "yalb.gcs/internal/gen/gcs/v1;gcsv1";

// Inbound MAVLink mission transaction payloads currently decoded by the codec.
message MissionItem {
  reserved 1;
  uint32 seq = 2;
  MavFrame frame = 3;
  MavCmd command = 4;
  bool current = 5;
  bool autocontinue = 6;
  float param1 = 7;
  float param2 = 8;
  float param3 = 9;
  float param4 = 10;
  double x = 11; // latitude in degrees, or local x in metres
  double y = 12; // longitude in degrees, or local y in metres
  float z = 13;  // altitude or local z in metres
  MavMissionType mission_type = 14;
}

message MissionCount {
  uint32 count = 1;
  MavMissionType mission_type = 2;
}

message MissionAck {
  reserved 1;
  MavMissionResult result = 2;
  MavMissionType mission_type = 3;
}
