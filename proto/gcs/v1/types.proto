  MAV_AUTOPILOT_PPZ = 9;
  MAV_AUTOPILOT_UDB = 10;
  MAV_AUTOPILOT_PX4 = 12;
}

// MavState mirrors MAV_STATE in common.xml.
// System status reported in HEARTBEAT.system_status.
enum MavState {
  MAV_STATE_UNINIT = 0;
  MAV_STATE_BOOT = 1;
  MAV_STATE_CALIBRATING = 2;
  MAV_STATE_STANDBY = 3;
  MAV_STATE_ACTIVE = 4;
  MAV_STATE_CRITICAL = 5;
  MAV_STATE_EMERGENCY = 6;
  MAV_STATE_POWEROFF = 7;
  MAV_STATE_FLIGHT_TERMINATION = 8;
}

// MavResult mirrors MAV_RESULT in common.xml.
// Returned in COMMAND_ACK.result.
enum MavResult {
  MAV_RESULT_ACCEPTED = 0;
  MAV_RESULT_TEMPORARILY_REJECTED = 1;
  MAV_RESULT_DENIED = 2;
  MAV_RESULT_UNSUPPORTED = 3;
  MAV_RESULT_FAILED = 4;
  MAV_RESULT_IN_PROGRESS = 5;
  MAV_RESULT_CANCELLED = 6;
  MAV_RESULT_COMMAND_LONG_ONLY = 7;
  MAV_RESULT_COMMAND_INT_ONLY = 8;
  MAV_RESULT_COMMAND_UNSUPPORTED_MAV_FRAME = 9;
}

