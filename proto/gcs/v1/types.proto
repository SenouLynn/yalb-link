// MavFrame mirrors MAV_FRAME in common.xml.
// Used in MISSION_ITEM_INT.frame to indicate coordinate reference.
enum MavFrame {
  MAV_FRAME_GLOBAL = 0;
  MAV_FRAME_LOCAL_NED = 1;
  MAV_FRAME_MISSION = 2;
  MAV_FRAME_GLOBAL_RELATIVE_ALT = 3;
  MAV_FRAME_LOCAL_ENU = 4;
  MAV_FRAME_GLOBAL_INT = 5;
  MAV_FRAME_GLOBAL_RELATIVE_ALT_INT = 6;
  MAV_FRAME_LOCAL_OFFSET_NED = 7;
  MAV_FRAME_BODY_NED = 8;
  MAV_FRAME_BODY_OFFSET_NED = 9;
  MAV_FRAME_GLOBAL_TERRAIN_ALT = 10;
  MAV_FRAME_GLOBAL_TERRAIN_ALT_INT = 11;
  MAV_FRAME_BODY_FRD = 12;
  MAV_FRAME_LOCAL_FRD = 20;
  MAV_FRAME_LOCAL_FLU = 21;
}

// GpsFixType mirrors GPS_FIX_TYPE in common.xml.
// Reported in GPS_RAW_INT.fix_type.
enum GpsFixType {
  GPS_FIX_TYPE_NO_GPS = 0;
  GPS_FIX_TYPE_NO_FIX = 1;
  GPS_FIX_TYPE_2D_FIX = 2;
  GPS_FIX_TYPE_3D_FIX = 3;
  GPS_FIX_TYPE_DGPS = 4;
  GPS_FIX_TYPE_RTK_FLOAT = 5;
  GPS_FIX_TYPE_RTK_FIXED = 6;
  GPS_FIX_TYPE_STATIC = 7;
  GPS_FIX_TYPE_PPP = 8;
}

// MavParamType mirrors MAV_PARAM_TYPE in common.xml.
// Encoded in PARAM_VALUE.param_type. Note: wire values start at 1.
enum MavParamType {
  MAV_PARAM_TYPE_UNSPECIFIED = 0;
  MAV_PARAM_TYPE_UINT8 = 1;
  MAV_PARAM_TYPE_INT8 = 2;
  MAV_PARAM_TYPE_UINT16 = 3;
  MAV_PARAM_TYPE_INT16 = 4;
  MAV_PARAM_TYPE_UINT32 = 5;
  MAV_PARAM_TYPE_INT32 = 6;
  MAV_PARAM_TYPE_UINT64 = 7;
  MAV_PARAM_TYPE_INT64 = 8;
  MAV_PARAM_TYPE_REAL32 = 9;
  MAV_PARAM_TYPE_REAL64 = 10;
}

// MavMissionType mirrors MAV_MISSION_TYPE in common.xml.
// Distinguishes flight plans, geofences, and rally points.
enum MavMissionType {
  MAV_MISSION_TYPE_MISSION = 0;
  MAV_MISSION_TYPE_FENCE = 1;
  MAV_MISSION_TYPE_RALLY = 2;
  MAV_MISSION_TYPE_ALL = 255;
}

// MavMissionResult mirrors MAV_MISSION_RESULT in common.xml.
// Returned in MISSION_ACK.type.
enum MavMissionResult {
  MAV_MISSION_ACCEPTED = 0;
  MAV_MISSION_ERROR = 1;
  MAV_MISSION_UNSUPPORTED_FRAME = 2;
  MAV_MISSION_UNSUPPORTED = 3;
  MAV_MISSION_NO_SPACE = 4;
  MAV_MISSION_INVALID = 5;
  MAV_MISSION_INVALID_PARAM1 = 6;
  MAV_MISSION_INVALID_PARAM2 = 7;
  MAV_MISSION_INVALID_PARAM3 = 8;
  MAV_MISSION_INVALID_PARAM4 = 9;
  MAV_MISSION_INVALID_PARAM5_X = 10;
  MAV_MISSION_INVALID_PARAM6_Y = 11;
  MAV_MISSION_INVALID_PARAM7 = 12;
  MAV_MISSION_INVALID_SEQUENCE = 13;
  MAV_MISSION_DENIED = 14;
  MAV_MISSION_OPERATION_CANCELLED = 15;
}

// MavSeverity mirrors MAV_SEVERITY in common.xml.
// Carried in STATUSTEXT.severity. Follows syslog conventions.
enum MavSeverity {
  MAV_SEVERITY_EMERGENCY = 0; // system unusable
  MAV_SEVERITY_ALERT = 1;     // action must be taken immediately
  MAV_SEVERITY_CRITICAL = 2;  // critical conditions
  MAV_SEVERITY_ERROR = 3;     // error conditions
  MAV_SEVERITY_WARNING = 4;   // warning conditions
  MAV_SEVERITY_NOTICE = 5;    // normal but significant
  MAV_SEVERITY_INFO = 6;      // informational
  MAV_SEVERITY_DEBUG = 7;     // debug-level messages
}

// MissionState mirrors MISSION_STATE in common.xml (MAVLink 2 extension).
// Carried in MISSION_CURRENT.mission_state; may be UNKNOWN on older firmware.
enum MissionState {
  MISSION_STATE_UNKNOWN = 0;
  MISSION_STATE_NO_MISSION = 1;
  MISSION_STATE_NOT_STARTED = 2;
  MISSION_STATE_ACTIVE = 3;
  MISSION_STATE_PAUSED = 4;
  MISSION_STATE_COMPLETE = 5;
}

// MavBatteryChargeState mirrors MAV_BATTERY_CHARGE_STATE in common.xml.
// Carried in BATTERY_STATUS.charge_state.
enum MavBatteryChargeState {
  MAV_BATTERY_CHARGE_STATE_UNDEFINED = 0;
  MAV_BATTERY_CHARGE_STATE_OK = 1;
  MAV_BATTERY_CHARGE_STATE_LOW = 2;
  MAV_BATTERY_CHARGE_STATE_CRITICAL = 3;
  MAV_BATTERY_CHARGE_STATE_EMERGENCY = 4;
  MAV_BATTERY_CHARGE_STATE_FAILED = 5;
  MAV_BATTERY_CHARGE_STATE_UNHEALTHY = 6;
  MAV_BATTERY_CHARGE_STATE_CHARGING = 7;
}
