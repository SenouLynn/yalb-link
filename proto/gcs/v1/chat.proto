syntax = "proto3";

package gcs.v1;

import "gcs/v1/track.proto";
import "google/protobuf/timestamp.proto";

option go_package = "yalb.gcs/internal/gen/gcs/v1;gcsv1";

// ChatOrigin identifies which protocol/adapter a message arrived on.
// The same channel may receive messages from multiple origins simultaneously.
enum ChatOrigin {
  CHAT_ORIGIN_UNSPECIFIED = 0;
  CHAT_ORIGIN_GCS_OPERATOR = 1;   // typed by a GCS frontend operator
  CHAT_ORIGIN_MESHTASTIC = 2;     // received over Meshtastic text message (PortNum 1)
  CHAT_ORIGIN_TAK_COT = 3;        // CoT GeoChat message
  CHAT_ORIGIN_SYSTEM = 4;         // generated by GCS backend (alerts, join/leave notices)
}

// ChatMessage is a single unit of chat, regardless of origin protocol.
// All origins are normalised into this shape before being published to Redis.
message ChatMessage {
  string id = 1;                  // GCS-assigned stable message ID (UUID)
  string channel = 2;             // channel name; "global" for unaddressed broadcast
  NodeId from_node = 3;           // sender identity; GCS_OPERATOR sets protocol = UNSPECIFIED
  string from_callsign = 4;       // display name of sender
  string text = 5;
  ChatOrigin origin = 6;
  bool delivered = 7;             // true once the underlying protocol confirmed delivery
  google.protobuf.Timestamp sent_at = 8;
  google.protobuf.Timestamp received_at = 9; // when GCS backend received/produced it
}

// ChatMessageRequest sends a message to a channel or a specific node.
// to_node is optional — omit for channel broadcast.
// channel defaults to "global" if empty.
message ChatMessageRequest {
  string channel = 1;
  optional NodeId to_node = 2;    // addressed message; omit for channel broadcast
  string text = 3;
  string from_callsign = 4;       // operator display name
}

// ChatMessageAck confirms the backend accepted and queued the message.
message ChatMessageAck {
  string message_id = 1;
  bool queued = 2;
  string error = 3;
}

// WatchMessagesRequest subscribes to messages on one or more channels.
// Empty channels list = subscribe to all channels.
// include_history, if true, replays stored history from Redis Streams before live messages.
message WatchMessagesRequest {
  repeated string channels = 1;
  bool include_history = 2;
  uint32 history_limit = 3;       // max messages to replay per channel; 0 = backend default (100)
}

// ChatChannel describes a named channel and its current state.
message ChatChannel {
  string name = 1;
  string description = 2;
  repeated ChatOrigin active_origins = 3; // which protocols are feeding this channel right now
  uint32 unread_count = 4;
}

// ListChannelsRequest returns known channels with unread counts.
message ListChannelsRequest {}

// ListChannelsResponse carries all known channels.
message ListChannelsResponse {
  repeated ChatChannel channels = 1;
}
