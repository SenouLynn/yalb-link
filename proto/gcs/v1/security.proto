syntax = "proto3";

package gcs.v1;

import "google/protobuf/timestamp.proto";

option go_package = "ligma-gcs/proto/gcs/v1;gcsv1";

// TlsConfig specifies transport-layer encryption for a network connection.
// Applied at link open time — zero per-message overhead after handshake.
// insecure_skip_verify is rejected by the backend when production_mode = true.
message TlsConfig {
  bool enabled = 1;
  string cert_pem = 2;           // PEM certificate (inline or "file://<path>")
  string key_pem = 3;            // PEM private key
  string ca_pem = 4;             // CA cert for mTLS peer verification; empty = system CAs
  bool insecure_skip_verify = 5; // dev/SITL only
}

// MavlinkSigningConfig enables MAVLink 2 packet signing on a transport link.
// Signing provides authentication and integrity — not confidentiality.
// Confidentiality is the WireGuard layer's job (OS-level, zero app overhead).
//
// key_ref names a secret in the GCS secrets store (env var / secrets manager).
// The 32-byte key is never carried in proto — resolved server-side only.
// allow_unsigned eases migration: accept unsigned packets alongside signed ones
// until all nodes on the link are upgraded. Disable once migration is complete.
message MavlinkSigningConfig {
  bool enabled = 1;
  string key_ref = 2;
  bool allow_unsigned = 3;
  repeated uint32 trusted_system_ids = 4; // empty = enforce on all systems
}

// LinkSecurityConfig bundles security settings for a transport link.
// Applied once at ConnectLink time; does not touch the per-packet hot path.
// WireGuard is not configured here — it is managed at the OS/deployment level
// and is transparent to the application. Document WireGuard peers in deployment config.
message LinkSecurityConfig {
  TlsConfig tls = 1;
  MavlinkSigningConfig mavlink_signing = 2;
}

// OperatorContext carries authenticated operator identity derived from the JWT.
// Populated by backend auth middleware — never sent by or trusted from the client.
// Attached to AuditEvents for all security-relevant actions.
// Never placed in the MAVLink command hot path.
message OperatorContext {
  string operator_id = 1;    // stable subject claim from JWT (e.g. Supabase user UUID)
  string display_name = 2;
  string session_id = 3;     // connection-scoped ID for tracing
  repeated string roles = 4; // e.g. ["operator"], ["admin"], ["observer"]
}

// AuditEventType classifies security-relevant actions.
enum AuditEventType {
  AUDIT_EVENT_TYPE_UNSPECIFIED = 0;
  AUDIT_EVENT_TYPE_OPERATOR_AUTHENTICATED = 1;
  AUDIT_EVENT_TYPE_OPERATOR_DISCONNECTED = 2;
  AUDIT_EVENT_TYPE_OPERATOR_AUTH_FAILED = 3;
  AUDIT_EVENT_TYPE_COMMAND_ISSUED = 4;
  AUDIT_EVENT_TYPE_COMMAND_DENIED = 5;
  AUDIT_EVENT_TYPE_ARM_DISARM = 6;
  AUDIT_EVENT_TYPE_MODE_CHANGE = 7;
  AUDIT_EVENT_TYPE_LINK_CONNECTED = 8;
  AUDIT_EVENT_TYPE_LINK_DISCONNECTED = 9;
  AUDIT_EVENT_TYPE_SIGNING_FAILURE = 10;
  AUDIT_EVENT_TYPE_PARAMETER_CHANGED = 11;
  AUDIT_EVENT_TYPE_MISSION_UPLOADED = 12;
  AUDIT_EVENT_TYPE_MISSION_CLEARED = 13;
  AUDIT_EVENT_TYPE_CALIBRATION_STARTED = 14;
}

// AuditEvent is a security-relevant log entry.
// Written asynchronously to a Redis Stream after the triggering action completes.
// The audit write never blocks the command path.
message AuditEvent {
  string event_id = 1;
  AuditEventType type = 2;
  OperatorContext operator = 3; // empty for system-generated events
  string node_id = 4;
  string link_id = 5;
  string details = 6;           // human-readable summary (command type, param name, etc.)
  google.protobuf.Timestamp occurred_at = 7;
}

// WatchAuditRequest subscribes to the live audit event stream.
// include_history replays stored events from Redis Streams before live events.
message WatchAuditRequest {
  repeated AuditEventType event_types = 1; // empty = all
  bool include_history = 2;
  uint32 history_limit = 3; // 0 = backend default (500)
}
