syntax = "proto3";

package gcs.v1;

import "gcs/v1/commands.proto";
import "gcs/v1/missions.proto";
import "gcs/v1/parameters.proto";
import "gcs/v1/vehicle.proto";

option go_package = "yalb.gcs/internal/gen/gcs/v1;gcsv1";

// ProtocolEvent carries inbound responses that require transaction
// correlation rather than aggregation into vehicle telemetry state.
message ProtocolEvent {
  VehicleId vehicle_id = 1;

  oneof payload {
    ParameterValue param_value = 2;
    MissionCount mission_count = 3;
    MissionItem mission_item = 4;
    MissionAck mission_ack = 5;
    CommandAck command_ack = 6;
  }
}
