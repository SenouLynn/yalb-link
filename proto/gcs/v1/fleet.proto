syntax = "proto3";

package gcs.v1;

import "gcs/v1/vehicle.proto";
import "google/protobuf/timestamp.proto";

option go_package = "yalb.gcs/internal/gen/gcs/v1;gcsv1";

enum FleetEventType {
  FLEET_EVENT_TYPE_UNSPECIFIED = 0;
  FLEET_EVENT_TYPE_VEHICLE_DISCOVERED = 1;
  FLEET_EVENT_TYPE_VEHICLE_LOST = 2;
  FLEET_EVENT_TYPE_VEHICLE_RECOVERED = 3;
  FLEET_EVENT_TYPE_HEARTBEAT_UPDATED = 4;
}

message FleetEvent {
  FleetEventType type = 1;
  VehicleId vehicle_id = 2;
  HeartbeatState heartbeat = 3;
  google.protobuf.Timestamp occurred_at = 4;
}
