syntax = "proto3";

package gcs.v1;

import "gcs/v1/commands.proto";
import "gcs/v1/types.proto";
import "gcs/v1/vehicle.proto";
import "google/protobuf/timestamp.proto";

option go_package = "yalb.gcs/internal/gen/gcs/v1;gcsv1";

// CalibrationRequest initiates a preflight calibration sequence.
// Translates to MAV_CMD_PREFLIGHT_CALIBRATION (#241) with the appropriate
// param combination for the requested type. See CalibrationType comments.
message CalibrationRequest {
  VehicleId target = 1;
  CalibrationType type = 2;
}

// MagCalProgress mirrors MAG_CAL_PROGRESS (#191, common.xml).
// Streamed during active compass calibration — one per compass per update tick.
// The vehicle emits these continuously while rotating during step two.
message MagCalProgress {
  VehicleId vehicle_id = 1;
  uint32 compass_id = 2;          // 0-indexed compass instance
  uint32 cal_mask = 3;            // bitmask: which compasses are calibrating simultaneously
  CompassCalStatus cal_status = 4;
  uint32 attempt = 5;             // calibration attempt number; autopilot may retry automatically
  uint32 completion_pct = 6;      // 0–100
  bytes completion_mask = 7;      // 10-byte bitmask of completed calibration sections
  float direction_x = 8;         // current target direction vector (unit vector)
  float direction_y = 9;
  float direction_z = 10;
  google.protobuf.Timestamp observed_at = 11;
}

// MagCalReport mirrors MAG_CAL_REPORT (#192, common.xml).
// Emitted once per compass when a calibration attempt finishes (pass or fail).
// fitness is RMS milligauss residuals — values below 10 are generally acceptable;
// below 5 is good; above 20 usually indicates a magnetic interference problem.
message MagCalReport {
  VehicleId vehicle_id = 1;
  uint32 compass_id = 2;
  uint32 cal_mask = 3;
  CompassCalStatus cal_status = 4;
  bool autosaved = 5;             // true if params were written to EEPROM automatically

  float fitness = 6;              // RMS milligauss residuals

  // 3×3 soft-iron calibration matrix (diagonal + off-diagonal elements).
  float ofs_x = 7;
  float ofs_y = 8;
  float ofs_z = 9;
  float diag_x = 10;
  float diag_y = 11;
  float diag_z = 12;
  float offdiag_x = 13;
  float offdiag_y = 14;
  float offdiag_z = 15;

  float orientation_confidence = 16; // 0.0–1.0; < 0.5 = bad orientation detected
  uint32 old_orientation = 17;       // MAV_SENSOR_ORIENTATION before calibration
  uint32 new_orientation = 18;       // MAV_SENSOR_ORIENTATION suggested post-calibration
  float scale_factor = 19;

  google.protobuf.Timestamp observed_at = 20;
}

// CalibrationStatusText carries a STATUSTEXT message intercepted during calibration.
// Gyro, accel, radio, ESC, and airspeed calibrations report progress exclusively
// through STATUSTEXT; there are no structured progress messages for these types.
message CalibrationStatusText {
  MavSeverity severity = 1;
  string text = 2;
  google.protobuf.Timestamp observed_at = 3;
}

// CalibrationEvent is the streaming envelope emitted by CalibrationService.StartCalibration.
// The stream runs until calibration completes, fails, or the client cancels.
message CalibrationEvent {
  CalibrationType calibration_type = 1;

  oneof payload {
    MagCalProgress mag_progress = 2;   // compass only: rotation progress
    MagCalReport mag_report = 3;       // compass only: per-compass final result
    CalibrationStatusText status = 4;  // all types: text progress and phase transitions
    CommandAck command_ack = 5;        // command acceptance / non-compass completion
  }
}
