syntax = "proto3";

package gcs.v1;

import "gcs/v1/types.proto";

option go_package = "yalb.gcs/internal/gen/gcs/v1;gcsv1";

// ParameterValue mirrors PARAM_VALUE (#22). The value remains in its wire
// representation; interpreting integer parameters depends on the negotiated
// MAVLink parameter encoding and is not implemented yet.
message ParameterValue {
  reserved 1, 7;
  string param_id = 2;
  float param_value = 3;
  MavParamType param_type = 4;
  uint32 param_count = 5;
  uint32 param_index = 6; // 65535 = unknown
}
