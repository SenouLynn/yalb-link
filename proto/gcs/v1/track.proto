syntax = "proto3";

package gcs.v1;

import "gcs/v1/types.proto";
import "gcs/v1/vehicle.proto";
import "google/protobuf/timestamp.proto";

option go_package = "ligma-gcs/proto/gcs/v1;gcsv1";

// NodeProtocol identifies which adapter produced a Track.
// A single physical device may appear under multiple protocols simultaneously
// (e.g., a vehicle with a Meshtastic relay: one MAVLINK track, one MESHTASTIC track).
enum NodeProtocol {
  NODE_PROTOCOL_UNSPECIFIED = 0;
  NODE_PROTOCOL_MAVLINK = 1;      // id encodes "sysid:compid"
  NODE_PROTOCOL_MESHTASTIC = 2;   // id encodes Meshtastic node ID (hex uint32)
  NODE_PROTOCOL_ADSB = 3;         // id encodes ICAO 24-bit address (hex)
  NODE_PROTOCOL_TAK_COT = 4;      // id encodes CoT UID
  NODE_PROTOCOL_NMEA = 5;         // id assigned by GCS for external GPS device
}

// NodeId is a protocol-agnostic entity identifier used by the track layer.
// MAVLink-specific services (CommandService, TelemetryService, etc.) use VehicleId.
// The track layer uses NodeId so the map works uniformly across all protocols.
message NodeId {
  string id = 1;               // stable, opaque within the GCS instance
  NodeProtocol protocol = 2;
}

// TrackType classifies the physical entity behind a node.
// Determines map icon, default display rules, and which detail fields are relevant.
enum TrackType {
  TRACK_TYPE_UNSPECIFIED = 0;
  TRACK_TYPE_AERIAL_VEHICLE = 1;     // drone, fixed-wing, VTOL
  TRACK_TYPE_GROUND_VEHICLE = 2;     // rover, UGV, car
  TRACK_TYPE_SURFACE_VEHICLE = 3;    // boat, USV
  TRACK_TYPE_SUBSURFACE_VEHICLE = 4; // ROV, UUV, submarine
  TRACK_TYPE_HUMAN = 5;              // operator, field team member
  TRACK_TYPE_STATIC_SENSOR = 6;      // fixed sensor node (weather, acoustic, etc.)
  TRACK_TYPE_BASE_STATION = 7;       // relay, router, mesh infrastructure node
  TRACK_TYPE_AIRCRAFT = 8;           // ADS-B civilian or commercial aircraft
  TRACK_TYPE_POI = 9;                // point of interest, landmark
  TRACK_TYPE_UNKNOWN = 10;
}

// TrackAffiliation follows MIL-STD-2525 / CoT conventions for situational awareness.
enum TrackAffiliation {
  TRACK_AFFILIATION_UNKNOWN = 0;
  TRACK_AFFILIATION_PENDING = 1;   // observed but not yet classified
  TRACK_AFFILIATION_FRIENDLY = 2;
  TRACK_AFFILIATION_NEUTRAL = 3;
  TRACK_AFFILIATION_HOSTILE = 4;
}

// TrackEventType classifies lifecycle transitions in the track layer.
enum TrackEventType {
  TRACK_EVENT_TYPE_UNSPECIFIED = 0;
  TRACK_EVENT_TYPE_APPEARED = 1;   // new node first observed
  TRACK_EVENT_TYPE_UPDATED = 2;    // position or state changed
  TRACK_EVENT_TYPE_STALE = 3;      // no update received within stale window
  TRACK_EVENT_TYPE_LOST = 4;       // gone beyond stale window; track removed
}

// MavlinkDetail carries MAVLink-specific state for tracks produced by the MAVLink adapter.
// vehicle_id cross-references the full MAVLink domain (commands, telemetry, params, missions).
message MavlinkDetail {
  VehicleId vehicle_id = 1;
  MavType vehicle_type = 2;
  MavAutopilot autopilot = 3;
  MavState system_status = 4;
  bool armed = 5;
  string flight_mode = 6;          // decoded firmware-specific mode name
  int32 battery_remaining_pct = 7; // -1 = unknown
  // link_ids lists the transport links this vehicle is currently reachable on.
  // Includes both direct and Meshtastic-relayed links.
  repeated string link_ids = 8;
}

// MeshtasticRole mirrors Config.DeviceConfig.Role in the Meshtastic protobuf schema.
enum MeshtasticRole {
  MESHTASTIC_ROLE_CLIENT = 0;
  MESHTASTIC_ROLE_CLIENT_MUTE = 1;
  MESHTASTIC_ROLE_ROUTER = 2;
  MESHTASTIC_ROLE_ROUTER_CLIENT = 3;
  MESHTASTIC_ROLE_REPEATER = 4;
  MESHTASTIC_ROLE_TRACKER = 5;
  MESHTASTIC_ROLE_SENSOR = 6;
  MESHTASTIC_ROLE_TAK = 7;
  MESHTASTIC_ROLE_CLIENT_HIDDEN = 8;
  MESHTASTIC_ROLE_LOST_AND_FOUND = 9;
  MESHTASTIC_ROLE_TAK_TRACKER = 10;
}

// MeshtasticDetail carries state reported by a Meshtastic node over the mesh.
// Applies to any entity type — vehicle, human, static sensor.
// Environment fields are only populated for nodes with sensors (SENSOR role or equipped hardware).
// is_mavlink_relay + mavlink_link_id are set when this node is bridging MAVLink frames.
message MeshtasticDetail {
  // Node identity (from User mesh packet)
  string long_name = 1;
  string short_name = 2;         // 2–4 char callsign displayed on map
  string hw_model = 3;           // hardware model identifier string
  bool is_licensed = 4;          // amateur radio licence flag
  MeshtasticRole role = 5;

  // Mesh link quality (last received packet)
  float snr = 6;                 // signal-to-noise ratio, dB
  int32 rssi = 7;                // received signal strength, dBm
  uint32 hops_away = 8;          // hop count to this node (0 = direct)

  // Device metrics (Telemetry/DeviceMetrics mesh packet)
  uint32 battery_level_pct = 9;  // 0–100; 0 = unknown or wired
  float voltage = 10;             // battery voltage
  float channel_utilization = 11; // % of channel time used across the mesh
  float air_util_tx = 12;         // % of time this node spent transmitting
  uint32 uptime_s = 13;

  // Environment metrics (Telemetry/EnvironmentMetrics — SENSOR role nodes)
  optional float temperature_c = 14;
  optional float relative_humidity_pct = 15;
  optional float barometric_pressure_hpa = 16;
  optional float gas_resistance_ohm = 17;
  optional float wind_speed_m_s = 18;
  optional float wind_direction_deg = 19;
  optional float rainfall_mm = 20;

  // MAVLink relay: set when this Meshtastic node is bridging MAVLink frames.
  // mavlink_link_id cross-references a LinkStatus entry in FleetService.
  bool is_mavlink_relay = 21;
  string mavlink_link_id = 22;
}

// AdsbEmitterType mirrors ADSB_EMITTER_TYPE in common.xml.
enum AdsbEmitterType {
  ADSB_EMITTER_TYPE_NO_INFO = 0;
  ADSB_EMITTER_TYPE_LIGHT = 1;
  ADSB_EMITTER_TYPE_SMALL = 2;
  ADSB_EMITTER_TYPE_LARGE = 3;
  ADSB_EMITTER_TYPE_HIGH_VORTEX_LARGE = 4;
  ADSB_EMITTER_TYPE_HEAVY = 5;
  ADSB_EMITTER_TYPE_HIGHLY_MANUV = 6;
  ADSB_EMITTER_TYPE_ROTOCRAFT = 7;
  ADSB_EMITTER_TYPE_GLIDER = 9;
  ADSB_EMITTER_TYPE_LIGHTER_AIR = 10;
  ADSB_EMITTER_TYPE_PARACHUTE = 11;
  ADSB_EMITTER_TYPE_ULTRA_LIGHT = 12;
  ADSB_EMITTER_TYPE_UAV = 14;
  ADSB_EMITTER_TYPE_SPACE = 15;
  ADSB_EMITTER_TYPE_EMERGENCY_SURFACE = 17;
  ADSB_EMITTER_TYPE_SERVICE_SURFACE = 18;
  ADSB_EMITTER_TYPE_POINT_OBSTACLE = 19;
}

// AdsbDetail carries ADS-B transponder data.
// Produced by the MAVLink ADSB_VEHICLE (#246) adapter OR by an external
// ADS-B receiver adapter (dump1090/Beast format). Both produce the same Track shape.
message AdsbDetail {
  uint32 icao_address = 1;       // 24-bit ICAO address
  string flight_id = 2;          // up to 8-char flight ID / callsign
  uint32 squawk = 3;             // 4-digit octal transponder code
  AdsbEmitterType emitter_type = 4;
  bool geometric_altitude = 5;   // true = geometric (GNSS), false = pressure (QNH)
  bool ident_active = 6;         // SPI — special position ident active
  uint32 tslc_s = 7;             // time since last ADS-B communication, seconds
  // ADSB_FLAGS bitmask (from common.xml) — raw flags for capabilities not individually decoded
  uint32 flags = 8;
}

// CotDetail carries CoT (Cursor on Target) protocol fields for TAK-originated tracks.
message CotDetail {
  string cot_type = 1;           // CoT type string, e.g. "a-f-G-U-C" (friendly ground combat unit)
  string how = 2;                 // how the position was determined, e.g. "m-g" (GPS)
  string remarks = 3;             // free-text remarks from the CoT detail element
  string group_name = 4;          // TAK team/group name
  string group_role = 5;          // TAK role within group
  string phone = 6;               // contact phone if present
  string uid = 7;                 // original CoT UID (also encoded in NodeId.id)
}

// Track is the protocol-agnostic representation of any positioned entity.
// All adapters normalise their domain events into Track before publishing to Redis.
// The map layer consumes only Track — it has no protocol dependencies.
message Track {
  NodeId node_id = 1;
  TrackType type = 2;
  TrackAffiliation affiliation = 3;
  string callsign = 4;            // human-readable display name

  // Position — all adapters must populate these if position is available.
  double lat_deg = 5;
  double lon_deg = 6;
  float alt_msl_m = 7;

  // Motion — populate where available; zero/omit if not reported.
  float speed_m_s = 8;
  float course_deg = 9;           // degrees true, 0–360
  float climb_m_s = 10;           // positive = ascending

  // Timing
  google.protobuf.Timestamp observed_at = 11;
  google.protobuf.Timestamp stale_at = 12;  // track goes grey past this timestamp

  // Protocol-specific detail — exactly one is set per track.
  oneof detail {
    MavlinkDetail mavlink = 13;
    MeshtasticDetail meshtastic = 14;
    AdsbDetail adsb = 15;
    CotDetail cot = 16;
  }
}

// TrackEvent is the streaming envelope for TrackService.WatchTracks.
message TrackEvent {
  TrackEventType type = 1;
  Track track = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

// WatchTracksRequest subscribes to track events.
// Empty node_ids and empty protocols = subscribe to all tracks.
message WatchTracksRequest {
  repeated NodeId node_ids = 1;         // filter to specific nodes
  repeated NodeProtocol protocols = 2;  // filter by protocol (e.g. MESHTASTIC only)
  repeated TrackType types = 3;         // filter by entity type
  bool include_stale = 4;               // if false (default), suppress STALE/LOST events
}

// GetTrackRequest fetches the last-known track for a node from Redis.
message GetTrackRequest {
  NodeId node_id = 1;
}
