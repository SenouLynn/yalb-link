version: v2

# Managed mode is deliberately off: go_package is declared explicitly in every
# .proto so the import path is visible where the contract lives, not inferred
# from generator config.

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: internal/gen
    opt: paths=source_relative

  # Pin the generator that produced the committed TypeScript files.
  - remote: buf.build/bufbuild/es:v2.14.0
    out: frontend/src/gen
    opt: target=ts
