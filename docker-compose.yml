# Development topology: one Copter and backend by default; optional UI and
# mixed-fleet profiles.
#
#   docker compose up                        one vehicle (Copter)
#   docker compose --profile multi-sitl up   mixed fleet: Copter + Plane + a
#                                            second Copter, all on one socket
#   docker compose --profile ui up           adds the frontend dev server

name: yalb-gcs

# Runtime settings shared by SITL services.
x-sitl-env: &sitl-env
  # Each autopilot streams to the backend's shared UDP listener.
  GCS_OUT: udpclient:gcs-backend:14550
  HOME_LOCATION: 37.7749,-122.4194,10,0
  SPEEDUP: "1"

x-sitl-common: &sitl-common
  depends_on:
    gcs-backend:
      condition: service_started
  restart: unless-stopped

services:
  ardupilot-sitl-copter-1:
    <<: *sitl-common
    container_name: yalb-sitl-copter-1
    build:
      context: ./docker/sitl
      args:
        ARDUPILOT_TAG: Copter-4.7.0
        WAF_TARGET: copter
        DEFAULT_PARAMS_PATH: Tools/autotest/default_params/copter.parm
    environment:
      <<: *sitl-env
      SYSID: "1"
      VEHICLE_MODEL: "+"
    ports:
      # SITL's own MAVLink TCP port, for mavproxy or Mission Planner attaching
      # from the host. The UDP feed to the backend stays inside the network.
      - "5760:5760"

  ardupilot-sitl-plane-2:
    <<: *sitl-common
    container_name: yalb-sitl-plane-2
    profiles: [multi-sitl]
    build:
      context: ./docker/sitl
      args:
        ARDUPILOT_TAG: Plane-4.6.3
        WAF_TARGET: plane
        # Plane stock parameters use the models tree.
        DEFAULT_PARAMS_PATH: Tools/autotest/models/plane.parm
    environment:
      <<: *sitl-env
      SYSID: "2"
      VEHICLE_MODEL: plane
    ports:
      - "5761:5760"

  # Same firmware as sysid 1, distinct identity on the shared socket.
  ardupilot-sitl-copter-3:
    <<: *sitl-common
    container_name: yalb-sitl-copter-3
    profiles: [multi-sitl]
    build:
      context: ./docker/sitl
      args:
        ARDUPILOT_TAG: Copter-4.7.0
        WAF_TARGET: copter
        DEFAULT_PARAMS_PATH: Tools/autotest/default_params/copter.parm
    environment:
      <<: *sitl-env
      SYSID: "3"
      VEHICLE_MODEL: "+"
    ports:
      - "5762:5760"

  gcs-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yalb-backend
    environment:
      GCS_MAVLINK_UDP_BIND: 0.0.0.0:14550
      # Enable per-frame logs with GCS_LOG_LEVEL=debug.
      GCS_LOG_LEVEL: ${GCS_LOG_LEVEL:-info}
    ports:
      - "8080:8080"
      # Host tools and SITL feed the same backend listener.
      - "14550:14550/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  gcs-frontend:
    build:
      context: ./frontend
    container_name: yalb-frontend
    profiles: [ui]
    environment:
      # Vite proxies /api here, so the browser only ever uses relative URLs and
      # the backend needs no CORS configuration.
      GCS_BACKEND_URL: http://gcs-backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - gcs-backend
    restart: unless-stopped
