# Development and CI topology: SITL vehicles, Redis, backend, frontend.
#
# There is no `version:` key — Compose v2 ignores it and warns. Optional
# services sit behind profiles so the default `docker compose up` is the
# smallest thing that can produce a discovered vehicle: one SITL, Redis, and
# the backend.
#
#   docker compose up                        one vehicle (Copter)
#   docker compose --profile multi-sitl up   mixed fleet: Copter + Plane + a
#                                            second Copter, all on one socket
#   docker compose --profile ui up           adds the frontend dev server
#   docker compose --profile tls up          adds nginx (needs docker/nginx/certs)

name: yalb-gcs

# Shared by every SITL service regardless of vehicle type. The build args are
# NOT here: they differ per vehicle and pinning them once would silently give
# every service the same firmware, which is the thing this topology exists to
# avoid.
x-sitl-env: &sitl-env
  # The autopilot dials the GCS; the GCS never dials the autopilot. One
  # listening socket on the backend receives every instance and tells them
  # apart by system ID, which is the whole point of the fleet-first design.
  GCS_OUT: udpclient:gcs-backend:14550
  HOME_LOCATION: 37.7749,-122.4194,10,0
  SPEEDUP: "1"

x-sitl-common: &sitl-common
  depends_on:
    gcs-backend:
      condition: service_started
  restart: unless-stopped

# Two vehicle types, two firmware lines. See ADR-0009 §4 — the split is
# coverage, not untidiness: Copter 4.7 is the first line to implement
# AVAILABLE_MODES (#435) and exercises ADR-0007's mode layer (a), while Plane
# 4.6 has no such message and exercises layer (b), the generated dialect enum
# fallback. Pinning both to one line leaves one layer permanently unexercised.
#
# `--count`-style swarms are same-type only, which is why these are separate
# services rather than replicas.
services:
  ardupilot-sitl-copter-1:
    <<: *sitl-common
    container_name: yalb-sitl-copter-1
    build:
      context: ./docker/sitl
      args:
        ARDUPILOT_TAG: Copter-4.7.0
        WAF_TARGET: copter
        DEFAULT_PARAMS_PATH: Tools/autotest/default_params/copter.parm
    environment:
      <<: *sitl-env
      SYSID: "1"
      VEHICLE_MODEL: "+"
    ports:
      # SITL's own MAVLink TCP port, for mavproxy or Mission Planner attaching
      # from the host. The UDP feed to the backend stays inside the network.
      - "5760:5760"

  ardupilot-sitl-plane-2:
    <<: *sitl-common
    container_name: yalb-sitl-plane-2
    profiles: [multi-sitl]
    build:
      context: ./docker/sitl
      args:
        ARDUPILOT_TAG: Plane-4.6.3
        WAF_TARGET: plane
        # Plane's stock parameters are under models/, not default_params/.
        # There is no default_params/plane.parm at any tag.
        DEFAULT_PARAMS_PATH: Tools/autotest/models/plane.parm
    environment:
      <<: *sitl-env
      SYSID: "2"
      VEHICLE_MODEL: plane
    ports:
      - "5761:5760"

  # A second Copter on the same image as sysid 1. This proves a different
  # property from the Plane: same type, same firmware, distinct system ID over
  # one shared socket — i.e. that routing dispatches on sysid and not on
  # source address. Reuses the cached image, so it costs a container, not a
  # build.
  ardupilot-sitl-copter-3:
    <<: *sitl-common
    container_name: yalb-sitl-copter-3
    profiles: [multi-sitl]
    build:
      context: ./docker/sitl
      args:
        ARDUPILOT_TAG: Copter-4.7.0
        WAF_TARGET: copter
        DEFAULT_PARAMS_PATH: Tools/autotest/default_params/copter.parm
    environment:
      <<: *sitl-env
      SYSID: "3"
      VEHICLE_MODEL: "+"
    ports:
      - "5762:5760"

  redis:
    image: redis:7-alpine
    container_name: yalb-redis
    # AOF on: fleet membership and the telemetry log should survive a restart
    # of a container nobody meant to restart. No auth in dev — the port is not
    # published outside the compose network by default.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  gcs-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yalb-backend
    environment:
      GCS_MAVLINK_UDP_BIND: 0.0.0.0:14550
      # Empty means unsigned frames are accepted from anything that can reach
      # the port. That is acceptable on this private bridge network and stops
      # being acceptable on a field box — the backend says so at startup. See
      # the transport threat model in docs/roadmap/tier-4-bridge-core.md.
      GCS_MAVLINK_SIGNING_KEY: ""
      GCS_REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
      # The backend is the process that listens on 14550, so this is where the
      # UDP publish belongs: it lets mavproxy on the host feed the same socket
      # the SITL containers do. Publishing it on a SITL container would map a
      # port nothing in that container binds.
      - "14550:14550/udp"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  gcs-frontend:
    build:
      context: ./frontend
    container_name: yalb-frontend
    profiles: [ui]
    environment:
      # Vite proxies /api to this target inside the compose network; outside
      # compose it falls back to localhost. See frontend/vite.config.ts.
      VITE_API_TARGET: http://gcs-backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - gcs-backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: yalb-nginx
    # Behind a profile because it cannot start without certificates, and a
    # service that fails on a fresh clone teaches everyone to ignore failures.
    # docs/runbooks/dev-setup.md has the openssl one-liner.
    profiles: [tls]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - gcs-backend
    restart: unless-stopped

volumes:
  redis-data:
