# golangci-lint v2 schema. Settings live under `linters.settings` in v2 —
# a top-level `linters-settings:` key is a v1 spelling and is rejected.
version: "2"

linters:
  default: standard
  enable:
    # Error handling
    - errcheck
    - errorlint
    - wrapcheck
    - nilerr
    - nilnesserr

    # Correctness
    - exhaustive
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - contextcheck
    - noctx

    # Code quality
    - gocritic
    - revive
    - misspell
    - unconvert
    - prealloc
    - unparam
    - makezero
    - wastedassign

    # Complexity / size
    - cyclop
    - funlen
    - gocognit

  settings:
    cyclop:
      max-complexity: 15

    funlen:
      lines: 80
      statements: 50

    gocognit:
      min-complexity: 20

    govet:
      enable-all: true

    exhaustive:
      default-signifies-exhaustive: true

    wrapcheck:
      ignore-sigs:
        - "errors.New("
        - "fmt.Errorf("
        - ".Errorf("

    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: unexported-return
        - name: error-strings
        - name: error-return
        - name: if-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # hugeParam only: FlightCase, Source, Equation and Trace are passed and
        # returned by value on purpose. Task 02 requires that evaluating a case
        # cannot mutate the caller's data and that inspecting equation metadata
        # cannot mutate the registry; value semantics are what guarantee both,
        # and a pointer parameter would reintroduce aliasing and nil. These are
        # per-evaluation algebraic calls, not a hot loop, so the copy cost the
        # check is warning about does not apply. No other gocritic check, and no
        # wrapcheck or funlen rule, is relaxed.
        - hugeParam

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
