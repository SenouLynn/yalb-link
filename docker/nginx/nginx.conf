# TLS termination in front of the Connect backend.
#
# ADR-0005 puts all security work at connection time: the handshake happens
# here, and everything behind it is plaintext on a private network. Certificates
# are not committed — docs/runbooks/dev-setup.md has the openssl command that
# writes them into docker/nginx/certs/.

server {
    listen 80;
    server_name _;

    # Plain HTTP exists only to send browsers somewhere useful.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://gcs-backend:8080;

        # Connect server-streaming RPCs are long-lived HTTP responses. Without
        # these three the proxy buffers the stream and the telemetry log
        # updates in bursts, or not at all.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
