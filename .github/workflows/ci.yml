name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking resolves .git#branch=origin/main from local history.
          # The default fetch-depth of 1 leaves that ref unresolvable, and the
          # failure mode is a gate that reports success on every PR.
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: buf lint
        run: buf lint proto

      - name: tier 0 contract gate
        run: ./scripts/check-tier-0.sh

      - name: buf breaking
        if: github.event_name == 'pull_request'
        # Run from the repo root: the .git input is resolved relative to the
        # working directory, so `cd proto` makes buf look for proto/.git.
        # subdir=proto is required or imports do not resolve in the ref.
        run: buf breaking proto --against '.git#branch=origin/main,subdir=proto'

  proto-gen-freshness:
    # Advisory only. This step runs `buf generate`, which fetches remote plugins
    # from the BSR. A BSR outage would otherwise block every PR — an external
    # dependency has no business gating the pipeline. Read the annotation; if it
    # is red, run `make proto-gen` and commit the result.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: generated stubs are current
        run: |
          make proto-gen
          git diff --exit-code internal/gen/ frontend/src/gen/

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      # The capability matrix is an executable artifact, not prose:
      # TestMatrixCoverage above asserts its numeric-ID rows equal the codec's
      # dispatch-table keys. This checks the other half — that no row is left
      # unstarted.
      - run: ./scripts/check-matrix.sh
      # Two couplings live in these three lines; both bit us (ADR-0006).
      #
      # The action major selects the linter major: v6 installs golangci-lint
      # v1.x, which cannot read our `version: "2"` .golangci.yml at all. And
      # the v1 binaries are built with go1.24, which refuses a module targeting
      # go 1.25.0 outright ("the Go language version used to build
      # golangci-lint is lower than the targeted Go version").
      #
      # `version: latest` was the other half: an unpinned input in a repo whose
      # whole toolchain posture is pinning. It resolved to the newest v1, so
      # the config-schema break and the Go break arrived together and neither
      # was attributable.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  bazel:
    # ADR-0001's hermetic checkpoint, covering both languages. Nothing here
    # depends on what happens to be installed on the runner: the Go SDK is pinned
    # in MODULE.bazel, Go dependency versions come from go.mod via gazelle's
    # go_deps, and JS dependency versions come from pnpm-lock.yaml via
    # npm_translate_lock. The go/ and frontend/ jobs above are the fast native
    # signal; this is the one that has to be right.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - run: bazel build //...
      - run: bazel test //...
      - name: BUILD files are current
        # gazelle is deterministic; a diff here means someone added a package or
        # a dependency without running `make bazel-tidy`. Scoped to BUILD files so
        # the failure message points at the cause.
        run: |
          bazel run //:gazelle
          git diff --exit-code -- '*BUILD.bazel' 'MODULE.bazel'

  containers:
    # Tier 4's container scaffolding. The compose topology, the backend image
    # and Redis actually starting are all fast; the SITL image is not, and has
    # its own job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compose topology validates
        run: docker compose config > /dev/null

      - name: tier 4 gate
        # Network is available here, so the ArduPilot pins are checked against
        # upstream rather than only for shape. This is the check that would
        # have caught `ArduCopter-4.6.0` on the day it landed.
        env:
          CHECK_TIER_4_ONLINE: "1"
        run: ./scripts/check-tier-4.sh

      - name: backend image builds
        run: docker compose build gcs-backend

      - name: redis starts cleanly
        run: |
          docker compose up -d --wait redis
          docker compose exec -T redis redis-cli ping | grep -q PONG
          docker compose down

  sitl-image:
    # The slow gate. A cold build clones ArduPilot and compiles SITL: 10-20
    # minutes. Running it on every PR would put that on every contributor's
    # critical path to catch a Dockerfile that changes a few times a year, so
    # it runs on pushes to main and on demand.
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    # Advisory, not blocking, until Tier 5 has a caller for it. Tier 5's exit
    # gate is the first live SITL connection; on that day this job becomes
    # required and this line comes out. Stated rather than implied, because a
    # job that is permanently red for unexplained reasons is how a whole CI
    # suite stops being read (ADR-0006).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # Both vehicle types, because they are different firmware lines and a
      # green Copter build says nothing about Plane (ADR-0009 §4).
      - name: Copter SITL image builds at the pinned tag
        run: docker compose build ardupilot-sitl-copter-1
      - name: Plane SITL image builds at the pinned tag
        run: docker compose build ardupilot-sitl-plane-2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # `defaults.run.working-directory` above applies to `run:` steps only, so
      # this action resolves paths from the repo root and looked for a
      # package.json that does not exist there. The `packageManager` pin lives
      # in frontend/package.json; point at it explicitly.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test -- --passWithNoTests
