name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
          version: 1.72.0

      - name: buf lint
        run: buf lint proto

      - name: contract checks
        run: ./scripts/check-contracts.sh

  proto-gen-freshness:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
          version: 1.72.0
      - name: generated stubs are current
        run: |
          make proto-gen
          git diff --exit-code internal/gen/ frontend/src/gen/

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: ./scripts/check-matrix.sh
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  bazel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - run: bazel build //...
      - run: bazel test //...
      - name: BUILD files are current
        run: |
          bazel run //:gazelle
          git diff --exit-code -- '*BUILD.bazel' 'MODULE.bazel'

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: compose topology validates
        run: docker compose config > /dev/null

      - name: container checks
        # CI also verifies that each pinned ArduPilot tag resolves upstream.
        env:
          CHECK_CONTAINERS_ONLINE: "1"
        run: ./scripts/check-containers.sh

      - name: backend image builds
        run: docker compose build gcs-backend

  sitl-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Copter SITL image builds at the pinned tag
        run: docker compose build ardupilot-sitl-copter-1
      - name: Plane SITL image builds at the pinned tag
        run: docker compose build ardupilot-sitl-plane-2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test -- --passWithNoTests
      - run: pnpm build
